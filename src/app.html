<!doctype html>
<html
  lang="en"
  data-theme="%theme%"
  data-entry="%entry%"
  style="background-color: var(--entry-background, var(--theme-canvas, #08090e))"
>
  <head>
    <meta charset="utf-8">
    <style>
    /* Keep the map black until its resolved style supplies the sea beneath the fading land. */
    html[data-entry="map"] {
      --entry-background: var(--map-sea-color, black);
    }
    @media (prefers-reduced-motion: no-preference) {
      html[data-entry="map"] {
        transition: background-color 360ms ease-out;
      }
    }
    </style>
    <link rel="icon" href="%sveltekit.assets%/favicon.png">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
    // Restore the last appearance before styles paint; account preferences reconcile after login.
    try {
      const theme = localStorage.getItem('hype-theme')
      const modes = {
        'hype-black': 'dark',
        'hype-dark': 'dark',
        'hype-light': 'light',
        'breadline-light': 'light',
        'breadline-dark': 'dark',
      }
      if (Object.hasOwn(modes, theme)) {
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.colorScheme = modes[theme]
      }
    } catch {
      // Storage restrictions leave the server-selected cookie or hub default intact.
    }
    </script>
    %sveltekit.head%
    <!-- PWA meta tags -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192x192.png">
  </head>
  <body data-sveltekit-preload-data="hover" class="overscroll-contain">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
