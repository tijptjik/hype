name: "DEPLOY :: Cloudflare"

on:
  push:
    branches:
      - main
      - preview

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/preview'
    uses: ./.github/workflows/build.yml
    with:
      environment: "preview"

  test:
    if: github.ref == 'refs/heads/preview'
    needs: build
    uses: ./.github/workflows/test.yml
    with:
      environment: "preview"

  test-production:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml
    with:
      environment: "production"

  deploy-preview:
    name: "DEPLOY :: Preview"
    if: github.ref == 'refs/heads/preview'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: "GIT :: Checkout"
        uses: actions/checkout@v4

      - name: "INSTALL :: Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: "CACHE :: Restore Dependencies"
        uses: actions/cache@v3
        id: cache-deps
        with:
          path: node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('package.json', 'bun.lock', 'patches/**') }}

      - name: "INSTALL :: Dependencies"
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: "VERIFY :: SvelteKit Patch"
        run: bun run verify:sveltekit-patch

      - name: "DEPLOY :: Cloudflare Worker"
        run: bun run deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    name: "DEPLOY :: Production"
    if: github.ref == 'refs/heads/main'
    needs: [test-production]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: "GIT :: Checkout"
        uses: actions/checkout@v4
        with:
          # The change check below compares the complete pushed range, not just HEAD^.
          fetch-depth: 0

      - name: "INSTALL :: Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: "CACHE :: Restore Dependencies"
        uses: actions/cache@v3
        id: cache-deps
        with:
          path: node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('package.json', 'bun.lock', 'patches/**') }}

      - name: "INSTALL :: Dependencies"
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: "VERIFY :: SvelteKit Patch"
        run: bun run verify:sveltekit-patch

      - name: "CHECK :: Asset Memory Repair Changes"
        id: asset-memory-repair-changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- \
            workers/asset-memory-repair \
            package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "DEPLOY :: Asset Memory Repair Worker"
        if: steps.asset-memory-repair-changes.outputs.changed == 'true'
        run: bun run deploy:asset-memory-repair:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: "DEPLOY :: Cloudflare Worker"
        run: bun run deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
